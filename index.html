<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Hub</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary: #4A90E2;
            --danger: #e74c3c;
            --locked: #f39c12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; overscroll-behavior-y: none; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; margin-top: 10px; }
        header h1 { font-size: 24px; color: var(--primary); }
        .settings-btn { font-size: 24px; cursor: pointer; background: none; border: none; }

        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 500px; margin: 0 auto; }

        .card {
            background-color: var(--card-bg); border-radius: 16px; padding: 25px 15px; text-align: center;
            color: var(--text-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative;
        }
        .card:active { transform: scale(0.96); }
        .icon { font-size: 32px; margin-bottom: 10px; }
        .card h2 { font-size: 14px; font-weight: 600; }
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 14px; }

        /* Modals (Settings & PIN) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; width: 90%; max-width: 400px; border-radius: 16px; padding: 20px;
            max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-bottom: 15px; font-size: 20px; }
        .close-btn { float: right; font-size: 20px; cursor: pointer; border: none; background: none; }

        /* Forms & Buttons */
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        button.primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        button.danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; }
        
        /* Settings List */
        .settings-list { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 10px; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .settings-item span { font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>My Hub</h1>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>

    <main class="dashboard" id="app-grid"></main>

    <!-- PIN Entry Modal -->
    <div id="pin-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('pin-modal')">×</button>
            <h2>Enter PIN</h2>
            <input type="password" inputmode="numeric" id="pin-input" placeholder="****">
            <button class="primary" onclick="verifyPin()">Unlock</button>
            <p id="pin-error" style="color: red; display: none; font-size: 12px;">Incorrect PIN</p>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('settings-modal')">×</button>
            <h2>Settings</h2>
            
            <button class="primary" onclick="setNewPin()" style="background: #27ae60;">Set/Change Master PIN</button>
            
            <h3 style="margin: 15px 0 10px; font-size: 16px;">Add New Option</h3>
            <input type="text" id="new-name" placeholder="Name (e.g. Bulking Tracker)">
            <input type="text" id="new-url" placeholder="URL (e.g. bulking.html)">
            <input type="text" id="new-icon" placeholder="Emoji Icon (e.g. 💪)">
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox" id="new-locked"> Require PIN Lock
            </label>
            <button class="primary" onclick="addApp()">Add Option</button>

            <div class="settings-list" id="settings-app-list"></div>
        </div>
    </div>

    <script>
        // Default data if first time loading
        const defaultApps = [
            { id: 1, name: "Bulking Tracker", url: "bulking.html", icon: "💪", locked: false },
            { id: 2, name: "Calculator", url: "calculator.html", icon: "🧮", locked: true }
        ];

        let apps = JSON.parse(localStorage.getItem('hub_apps')) || defaultApps;
        let masterPin = localStorage.getItem('hub_pin') || null;
        let pendingUrl = ""; // Stores where to go after PIN success

        // Initialize UI
        function renderApps() {
            const grid = document.getElementById('app-grid');
            const settingsList = document.getElementById('settings-app-list');
            grid.innerHTML = "";
            settingsList.innerHTML = "<h3>Manage Options</h3>";

            apps.forEach(app => {
                // Render Front-end Dashboard Card
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => handleAppClick(app);
                card.innerHTML = `
                    ${app.locked ? '<div class="lock-icon">🔒</div>' : ''}
                    <div class="icon">${app.icon}</div>
                    <h2>${app.name}</h2>
                `;
                grid.appendChild(card);

                // Render Settings List Item
                const listItem = document.createElement('div');
                listItem.className = 'settings-item';
                listItem.innerHTML = `
                    <span>${app.icon} ${app.name} ${app.locked ? '🔒' : '🔓'}</span>
                    <div>
                        <button onclick="toggleLock(${app.id})">${app.locked ? 'Unlock' : 'Lock'}</button>
                        <button class="danger" onclick="deleteApp(${app.id})">Del</button>
                    </div>
                `;
                settingsList.appendChild(listItem);
            });
        }

        function saveAndRender() {
            localStorage.setItem('hub_apps', JSON.stringify(apps));
            renderApps();
        }

        // Logic for clicking an app
        function handleAppClick(app) {
            if (app.locked) {
                if (!masterPin) {
                    alert("App is locked, but no PIN is set! Go to settings to set a PIN.");
                    return;
                }
                pendingUrl = app.url;
                document.getElementById('pin-modal').style.display = 'flex';
                document.getElementById('pin-input').value = '';
                document.getElementById('pin-input').focus();
            } else {
                window.location.href = app.url;
            }
        }

        // Security / PIN Logic
        function verifyPin() {
            const entered = document.getElementById('pin-input').value;
            if (entered === masterPin) {
                document.getElementById('pin-error').style.display = 'none';
                closeModal('pin-modal');
                window.location.href = pendingUrl;
            } else {
                document.getElementById('pin-error').style.display = 'block';
            }
        }

        function setNewPin() {
            const newPin = prompt("Enter your new master PIN (leave blank to remove lock):");
            if (newPin !== null) {
                masterPin = newPin;
                localStorage.setItem('hub_pin', masterPin);
                alert("Master PIN updated.");
            }
        }

        // Modals management
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // App Management (CRUD)
        function addApp() {
            const name = document.getElementById('new-name').value;
            const url = document.getElementById('new-url').value;
            const icon = document.getElementById('new-icon').value;
            const locked = document.getElementById('new-locked').checked;

            if (!name || !url) return alert("Name and URL are required!");

            apps.push({ id: Date.now(), name, url, icon, locked });
            
            // Clear form
            document.getElementById('new-name').value = '';
            document.getElementById('new-url').value = '';
            document.getElementById('new-icon').value = '';
            document.getElementById('new-locked').checked = false;

            saveAndRender();
        }

        function deleteApp(id) {
            if(confirm("Are you sure you want to delete this option?")) {
                apps = apps.filter(app => app.id !== id);
                saveAndRender();
            }
        }

        function toggleLock(id) {
            const app = apps.find(a => a.id === id);
            if (app) {
                app.locked = !app.locked;
                saveAndRender();
            }
        }

        // Start app
        renderApps();
    </script>
</body>
</html>
